
name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: unzip -o BelzMagicNative_GitHub.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias belzkey -keyalg RSA -keysize 2048 -validity 10000 -storepass belz1234 -keypass belz1234 -dname "CN=BelzMagic, O=BelzMagic, C=IR"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks release.keystore --ks-pass pass:belz1234 --key-pass pass:belz1234 --out BelzMagic-Release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BelzMagic v1.0.${{ github.run_number }}
          files: BelzMagic-Release.apk
